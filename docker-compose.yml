services:
  mongodb:
    image: mongo:6.0
    container_name: algovision-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: algovision
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - algovision-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/algovision --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: algovision-redis
    restart: unless-stopped
    # `requirepass` is read from the env so the password is never hard-coded.
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\";
        else
          redis-server --appendonly yes;
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - algovision-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algovision-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/algovision?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algovision-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Background worker — daily-challenge cron, leaderboard recompute, etc.
  # Runs as a separate process so the API request loop stays responsive.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algovision-worker
    restart: unless-stopped
    command: ["node", "workers/dailyChallengeWorker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/algovision?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algovision-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algovision-frontend
    restart: unless-stopped
    ports:
      - "3000:80"  # host:container — nginx now listens on 80 inside the image
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - algovision-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  algovision-network:
    driver: bridge
