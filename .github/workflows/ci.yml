name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel duplicate runs on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + test + coverage)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      COOKIE_SECRET: ci-cookie-secret
      MONGO_URI: mongodb://localhost:27017/algovision_test
      REDIS_URL: redis://localhost:6379
      MOCK_AI: 'true'
      DISABLE_RATE_LIMIT: 'true'
      DISABLE_CSRF: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci || npm install
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test (with coverage)
        working-directory: backend
        run: npm test -- --coverage --maxWorkers=2
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ─── Docker images (build only, no push) ────────────────────────────────
  docker:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t algovision/backend:ci backend
      - name: Build frontend image
        run: docker build -t algovision/frontend:ci frontend
