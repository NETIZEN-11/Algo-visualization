<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlgoVision AI - AI-powered DSA tutor with visualization engine" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="color-scheme" content="dark light" />

    <!-- Preconnect to backend so the first API call is a millisecond faster.
         The link is rewritten by Vite to use the actual API base at build
         time, so this works in dev (localhost:5000) and prod (VITE_API_URL). -->
    <link rel="preconnect" href="http://localhost:5000" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:5000" />

    <!-- Preconnect to Google Fonts so the Inter / Fira Code face is ready
         by the time the CSS finishes loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>AlgoVision AI - Master DSA with AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
